<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sin conexión — Aquino Studios</title>
  <meta name="theme-color" content="#0b0b0c">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="container launch">
    <span class="kicker">Sin conexión</span>
    <h1>Se cortó.</h1>
    <p class="muted" style="max-width:460px;margin:0 auto 32px">No hay internet en este momento. Cuando vuelva la conexión, la página se recarga sola.</p>
    <button class="btn btn-primary" onclick="location.reload()">Reintentar</button>
  </main>
  <script>addEventListener('online', () => location.reload());</script>
</body>
</html>
